# Place following lines in weasel.custom.yaml
# __patch:
#   - "patch/+": {__include: "__weasel.yaml:/patch"}

patch:
  app_options/+:
    dota2.exe:
      inline_preedit: true
    windowsterminal.exe:
      ascii_mode: true
    alacritty.exe:
      ascii_mode: true
    # everything.exe:
    #   ascii_mode: true
    # gvim.exe:
    #   ascii_mode: true
    # obsidian.exe:
    #   ascii_mode: true
    # sumatrapdf.exe:
    #   ascii_mode: true

  style:
    antialias_mode: default
    ascii_tip_follow_cursor: false
    color_scheme: flexoki_light
    color_scheme_dark: flexoki_dark
    font_face: "Chiron Hei HK VF"
    label_font_face: "Chiron Hei HK VF"
    comment_font_face: "Chiron Hei HK VF"
    font_point: 16
    label_font_point: 16
    comment_font_point: 16
    candidate_abbreviate_length: 0
    click_to_capture: false
    horizontal: false
    fullscreen: false
    inline_preedit: false
    preedit_type: composition
    display_tray_icon: false
    label_format: "%s."
    mark_text: ""
    paging_on_scroll: false
    vertical_auto_reverse: false
    vertical_text: false
    vertical_text_left_to_right: false
    vertical_text_with_wrap: false
    layout:
      align_type: center
      max_width: 0	#set 0 to disable max width
      min_width: 160
      min_height: 0
      max_height: 0	#set 0 to disable max height
      border_width: 3
      margin_x: 12
      margin_y: 12
      spacing: 10
      candidate_spacing: 5
      hilite_spacing: 4
      hilite_padding: 2
      round_corner: 0   #别名 hilited_corner_radius
      corner_radius: 0
      shadow_radius: 0
      shadow_offset_x: 4
      shadow_offset_y: 4
      linespacing: 0 # percentage of font point, 0 to disable
      baseline: 0 # percentage of font point, 0 to disable

  preset_color_schemes:
    ultramarine:
      name: Ultramarine
      author: "Ben Yip <yebenmy@gmail.com>"
      back_color: 15527662
      border_color: 14737632
      candidate_text_color: 0
      comment_text_color: 5132111
      hilited_back_color: 13948116
      hilited_candidate_back_color: 16711743
      hilited_candidate_text_color: 16777215
      hilited_comment_text_color: 14540253
      hilited_label_color: 16629165
      hilited_text_color: 0
      label_color: 5132111
      text_color: 0

    flexoki_light:
      name: flexoki
      author: "Ben Yip <yebenmy@gmail.com>"
      back_color: 0xF0FCFF
      border_color: 0xE5F0F2
      candidate_text_color: 0x0F0F10
      comment_text_color: 0x696E6F
      hilited_back_color: 0xD9E4E6
      hilited_candidate_back_color: 0xEFE7DB
      hilited_candidate_text_color: 0x0F0F10
      hilited_comment_text_color: 0x696E6F
      hilited_text_color: 0x0F0F10
      text_color: 0x0F0F10

    flexoki_dark:
      name: flexoki_dark
      author: "Ben Yip <yebenmy@gmail.com>"
      back_color: 0x0F0F10
      border_color: 0x1A1B1C
      candidate_text_color: 0xC3CDCE
      comment_text_color: 0x808587
      hilited_comment_text_color: 0x808587
      hilited_back_color: 0x262728
      hilited_candidate_back_color: 0x55351E
      hilited_candidate_text_color: 0xC3CDCE
      hilited_text_color: 0xC3CDCE
      text_color: 0xC3CDCE
