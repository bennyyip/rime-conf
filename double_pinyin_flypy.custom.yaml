patch:
  # 雙拼碼不轉換成全拼碼
  'translator/preedit_format': {}

  'schema/dependencies/+':
    - jyut6ping3

  switches:
    - name: ascii_mode
      reset: 0
      states: [中文, 西文]
    - name: traditionalization
      states: [汉字, 漢字]
      reset: 1
    - name: ascii_punct
      states: [。，, ．，]
    - name: emoji
      states: [💀, 😄]
      reset: 0
    - name: full_shape
      states: [半角, 全角]
      reset: 0

  'engine/segmentors':
    - ascii_segmentor
    - matcher
    - affix_segmentor@jyut
    - abc_segmentor
    - affix_segmentor@radical_lookup # 部件拆字自定义 tag
    - punct_segmentor
    - fallback_segmentor

  'engine/translators/+':
    - table_translator@jyut

  traditionalize/opencc_config: s2hk.json

  jyut:
    tag: jyut
    prism: jyut6ping3
    dictionary: jyut6ping3
    prefix: '`'
    # suffix: ";"
    initial_quality: 1.1 # 初始权重
    enable_sentence: true # 禁止造句
    enable_user_dict: true # 禁用用户词典
    tips: 〔粵語〕

  # 处理符合特定规则的输入码，如网址、反查
  'recognizer/patterns/+':
    jyut: '^`[a-z_]*;?$'
    radical_lookup: "^/r[a-z]+$"        # 响应部件拆字的反查，与 radical_lookup/prefix 匹配

  radical_lookup/prefix: "/r"

  # 'melt_eng/dictionary': melt_eng_flypy # 挂载词库 melt_eng.dict.yaml
  'translator/dictionary': my_dict

  # 不要用rime ice的symbol
  punctuator:
    import_preset: default

  translator/spelling_hints: 0

  # lua
  # corrector: "〔{comment}〕"
